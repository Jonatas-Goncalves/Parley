name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff requests

      - name: Lint
        run: ruff check src scripts tests packaging

      - name: Check the sources parse
        run: python -m compileall -q src packaging/linux/bootstrap.py packaging/windows/launcher.py

      - name: Check the packaging shell scripts
        run: |
          for script in packaging/linux/parley packaging/linux/build-deb.sh \
              packaging/linux/build-rpm.sh packaging/linux/stage-app.sh \
              packaging/appimage/build-appimage.sh \
              packaging/flatpak/build-flatpak.sh \
              packaging/flatpak/parley-wrapper.sh \
              scripts/sync-github.sh; do
            bash -n "$script"
          done

      - name: Run the test suite
        run: python -m pytest
