[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "parley"
version = "1.0.0"
description = "A local, voice-first language tutor for the Linux and Windows desktop."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Parley contributors" }]
keywords = ["language-learning", "tutor", "gtk4", "speech", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
]
dependencies = [
  "numpy>=1.24",
  "sounddevice>=0.4.6",
  "soundfile>=0.12",
  "requests>=2.31,<3",
  "faster-whisper>=1.1,<2",
  "av>=14,<19",
  "piper-tts>=1.2,<2",
]

[project.optional-dependencies]
# PyGObject ships with the operating system on Linux. Windows builds get it
# from conda-forge, so it is an extra instead of a hard pip dependency.
gui = ["PyGObject>=3.46"]
# Japanese speech needs an extra phoneme backend for Piper.
japanese = ["pyopenjtalk>=0.4,<1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
parley = "parley.__main__:main"

[project.urls]
Homepage = "https://github.com/Jonatas-Goncalves/Parley"
Issues = "https://github.com/Jonatas-Goncalves/Parley/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/parley"]

[tool.hatch.build.targets.wheel.force-include]
"src/parley/ui/style.css" = "parley/ui/style.css"
"src/parley/content/stories.json" = "parley/content/stories.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",  # long strings and translations are easier to read unwrapped
  "BLE001",  # network, audio and model failures must reach the interface
]

[tool.ruff.lint.per-file-ignores]
# gi.require_version must run before the gi.repository imports.
"src/parley/application.py" = ["E402"]
"src/parley/__main__.py" = ["E402"]
"src/parley/ui/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
"scripts/**/*.py" = ["E402"]
